<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후와 에셋</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root { --bg: #14100d; --card: #1f1a16; --line: #342b24; --ink: #f3ebe1; --muted: #a89c8f; --amber: #e7b04a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; line-height: 1.5; }
main { width: min(1100px, 100% - 32px); margin: 0 auto; padding: 32px 0 60px; }
h1 { margin: 0; font-size: 1.7rem; }
h1 span { color: var(--amber); }
.sub { color: var(--muted); margin: 4px 0 28px; font-size: .95rem; }
h2 { font-size: 1.15rem; margin: 36px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
figure .pic { aspect-ratio: 1; border-radius: 10px; background: #2a231d; display: grid; place-items: center; overflow: hidden; }
figure img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
figcaption { margin-top: 8px; font-size: .9rem; }
figcaption b { display: block; }
figcaption code { color: var(--muted); font-size: .78rem; }
.dl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dl a { color: var(--ink); text-decoration: none; font-size: .78rem; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.dl a:hover, .dl a:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
.dl small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>후와 <span>에셋</span></h1>
  <p class="sub">지금까지 만든 도트 후와 모음. 원본(PNG)과 움직이는 버전(GIF·WebP 640px, 4프레임).</p>

  <h2>캐릭터 12종</h2>
  <div class="grid" id="chars"></div>

  <h2>문 긁기 프레임</h2>
  <div class="grid" id="frames"></div>
</main>
<script>
const CHARS = [
  ["00-standing-grumpy", "근엄 모드"], ["01-standing-friendly", "기분 좋은 날"], ["02-sit", "정자세"],
  ["03-loaf", "식빵"], ["04-sleep", "꿀잠"], ["05-paw-reach", "손!"], ["06-peek", "감시 중"],
  ["07-stretch", "기지개"], ["08-groom", "그루밍"], ["09-play", "사냥 자세"], ["10-side-idle", "옆모습"],
  ["11-door-scratch", "문 열어"],
];
function card(src, name, code, links) {
  const f = document.createElement("figure");
  f.innerHTML = `<div class="pic"><img loading="lazy" decoding="async" alt=""></div><figcaption><b></b><code></code><div class="dl"></div></figcaption>`;
  f.querySelector("img").src = src;
  f.querySelector("img").alt = name;
  f.querySelector("b").textContent = name;
  f.querySelector("code").textContent = code;
  for (const [label, href] of links) {
    const a = document.createElement("a"); a.href = href; a.textContent = label; a.download = ""; f.querySelector(".dl").append(a);
  }
  return f;
}
for (const [k, name] of CHARS) {
  document.getElementById("chars").append(card(`fuwa/anim/${k}.webp`, name, k, [
    ["PNG 원본", `fuwa/still/${k}.png`], ["GIF", `fuwa/anim/${k}.gif`], ["WebP", `fuwa/anim/${k}.webp`],
  ]));
}
const fr = document.getElementById("frames");
fr.append(card("fuwa/frames/11-door-scratch.gif", "문 긁기 (처음 버전 GIF)", "11-door-scratch.gif", [["GIF", "fuwa/frames/11-door-scratch.gif"]]));
for (let i = 0; i < 4; i++) {
  fr.append(card(`fuwa/frames/11-door-scratch-${i}.png`, `프레임 ${i}`, `11-door-scratch-${i}.png`, [["PNG", `fuwa/frames/11-door-scratch-${i}.png`]]));
}
</script>
</body>
</html>
